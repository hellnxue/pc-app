<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel字段映射工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .upload-area.drag-over {
            border-color: #667eea;
            background: #e8eaff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .file-info {
            margin-top: 20px;
            color: #666;
        }

        .excel-preview {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            max-height: 400px;
            overflow: auto;
        }

        .excel-preview h3 {
            margin-bottom: 15px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
        }

        .mapping-panel {
            margin-bottom: 30px;
        }

        .mapping-panel h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .mapping-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .mapping-table td, .mapping-table th {
            border: 1px solid #ddd;
            padding: 12px;
        }

        .select-mapping {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .output pre {
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .success {
            color: #28a745;
        }

        .error {
            color: #dc3545;
        }

        .info {
            color: #17a2b8;
        }

        .similarity-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            background: #e9ecef;
            color: #495057;
        }

        .high-match {
            background: #d4edda;
            color: #155724;
        }

        .medium-match {
            background: #fff3cd;
            color: #856404;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel字段映射工具</h1>
            <p>将Excel字段自动匹配并替换到JavaScript配置中</p>
        </div>

        <div class="content">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p>点击或拖拽上传Excel文件</p>
                <p style="font-size: 12px; margin-top: 10px;">支持 .xlsx, .xls 格式</p>
                <div class="file-info" id="fileInfo"></div>
            </div>

            <div class="excel-preview" id="excelPreview" style="display: none;">
                <h3>📋 Excel数据预览</h3>
                <div id="excelTable"></div>
            </div>

            <div class="mapping-panel" id="mappingPanel" style="display: none;">
                <h3>🔗 字段映射配置</h3>
                <p style="margin-bottom: 10px; color: #666;">智能匹配建议已自动计算相似度，您也可以手动调整映射关系</p>
                <table class="mapping-table">
                    <thead>
                        <tr>
                            <th>JS字段 (prop)</th>
                            <th>JS标签 (label)</th>
                            <th>匹配的API字段</th>
                            <th>匹配详情</th>
                        </tr>
                    </thead>
                    <tbody id="mappingBody"></tbody>
                </table>
                <div style="margin-top: 20px;">
                    <button class="btn" onclick="applyMapping()">✅ 应用映射并生成代码</button>
                    <button class="btn btn-secondary" onclick="autoMatch()">🔄 重新智能匹配</button>
                </div>
            </div>

            <div id="outputArea" style="display: none;">
                <h3>📝 生成的JavaScript代码</h3>
                <div class="output">
                    <pre id="outputCode"></pre>
                </div>
                <button class="btn" onclick="copyToClipboard()" style="margin-top: 10px;">📋 复制代码</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
